const GT_STYLE = `
:root{
  --bg:#050506; --panel:#141416; --panel-2:#1b1c1f; --border:#2a2b2f; --border-strong:#3b3d42;
  --ink:#eef0f2; --muted:#9a9da3; --muted-2:#6c6f76; --steel:#c3c7cd; --steel-dark:#f2f3f4;
  --chrome1:#232427; --chrome2:#54575e; --chrome3:#aeb3ba; --accent:#c7cbd1; --danger:#d9776c; --ok:#7fd9a6;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 1px 2px rgba(0,0,0,.6), 0 14px 32px -16px rgba(0,0,0,.85);
}
*{box-sizing:border-box;}
body{color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(700px 560px at 6% 2%, rgba(124,58,237,.38), transparent 60%),
    radial-gradient(700px 600px at 96% 102%, rgba(232,62,209,.34), transparent 60%),
    linear-gradient(165deg,#060714 0%,#050506 42%,#0a0713 68%,#050506 100%);
  background-size:100% 100%,100% 100%,100% 100%;animation:gt-bgshift 8s ease-in-out infinite alternate;}
body.gt-no-bgmotion::before{animation:none;}
body.gt-no-cardanim .slot,body.gt-no-cardanim .day-chip,body.gt-no-cardanim .evo-item,body.gt-no-cardanim .muscle-group{animation:none!important;}
body.gt-no-cardanim *{transition:none!important;}
h1,h2,h3,.display{font-family:'Barlow Condensed',system-ui,sans-serif;letter-spacing:.01em;}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;z-index:1;display:flex;flex-direction:column;background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0) 140px);padding-bottom:86px;}
.topbar{padding:32px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;}
.gt-logo{width:44px;height:44px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,#e9ebed,#9aa0a8 55%,#6c6f76);box-shadow:var(--shadow);color:#0c0c0d;font-family:'Barlow Condensed';font-weight:800;font-size:17px;}
.greeting{font-family:'Barlow Condensed';font-size:44px;font-weight:800;line-height:1;letter-spacing:.02em;color:#f8faff;text-shadow:0 0 8px rgba(255,255,255,.6),0 0 20px rgba(168,120,255,.75),0 0 38px rgba(232,62,209,.55),0 0 60px rgba(124,58,237,.35);}
.greeting .tagline{display:block;font-family:'Inter';font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:8px;text-shadow:none;}
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:rgba(10,10,11,.78);backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;z-index:50;}
.tab-btn{flex:1;border:none;background:transparent;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:'Inter';font-weight:600;font-size:11.5px;color:var(--muted-2);cursor:pointer;transition:color .15s ease,transform .15s ease;}
.tab-btn:active{transform:scale(.94);}
.tab-btn svg{width:22px;height:22px;stroke:var(--muted-2);fill:none;stroke-width:1.75;transition:.15s;}
.tab-btn.active{color:var(--steel-dark);}
.tab-btn.active svg{stroke:var(--accent);}
.tab-btn.active{position:relative;}
.tab-btn.active::after{content:'';position:absolute;top:2px;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--steel));}
main{padding:6px 16px 28px;flex:1;}
.section-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:20px 2px 10px;}
.day-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;}
.day-row::-webkit-scrollbar{display:none;}
.day-chip{flex:0 0 auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 14px;cursor:pointer;box-shadow:var(--shadow);min-width:118px;animation:gt-risein .45s cubic-bezier(.16,1,.3,1) both;transition:border-color .15s ease,transform .15s ease;}
.day-chip:active{transform:scale(.97);}
.day-chip .dn{font-family:'Barlow Condensed';font-weight:700;font-size:15px;color:var(--steel-dark);line-height:1.1;}
.day-chip .ds{font-size:11.5px;color:var(--muted);margin-top:1px;}
.day-chip.active{background:linear-gradient(180deg,#5c5f66 0%,#2c2d30 55%,#1a1b1d 100%);border-color:var(--border-strong);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 -3px 5px rgba(0,0,0,.5) inset,0 4px 10px -2px rgba(0,0,0,.6);}
.day-chip.active .dn,.day-chip.active .ds{color:#fff;}
.category-block{margin-top:10px;}
.category-title{display:flex;align-items:center;gap:8px;font-family:'Barlow Condensed';font-weight:700;font-size:17px;color:var(--steel-dark);margin:14px 2px 10px;}
.category-title .pill{font-family:'Inter';font-size:10.5px;font-weight:700;color:var(--steel-dark);background:rgba(255,255,255,.06);border:1px solid var(--border-strong);padding:2px 8px;border-radius:999px;}
.muscle-group{margin-top:6px;animation:gt-risein .5s cubic-bezier(.16,1,.3,1) both;}
.muscle-title{font-family:'Barlow Condensed';font-weight:800;font-size:14.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--steel);margin:22px 2px 4px;padding-bottom:8px;border-bottom:1px solid var(--border-strong);}
.zone-label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:16px 2px 7px;}
.star-mark{color:var(--steel-dark);display:inline-flex;filter:drop-shadow(0 0 6px rgba(255,255,255,.25));}
.star-mark svg{width:14px;height:14px;}
.icon-btn.star-active{color:var(--steel-dark);}
.icon-btn.star-active:hover{background:rgba(255,255,255,.08);}
.add-slot-btn{width:100%;border:1.5px dashed var(--border-strong);background:transparent;color:var(--muted);border-radius:var(--radius-sm);padding:11px;font-family:'Inter';font-weight:600;font-size:13px;cursor:pointer;margin:10px 0 6px;display:flex;align-items:center;justify-content:center;gap:7px;transition:border-color .15s ease,color .15s ease,transform .1s ease;}
.add-slot-btn:hover{border-color:var(--accent);color:var(--steel-dark);}
.add-slot-btn:active{transform:scale(.98);}
.add-slot-btn svg{width:15px;height:15px;}
.slot{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden;position:relative;animation:gt-risein .45s cubic-bezier(.16,1,.3,1) both;}
.gt-carousel-wrap{position:relative;overflow:hidden;margin-bottom:18px;border-radius:var(--radius);}
.gt-carousel-wrap .slot{margin-bottom:0;}
.gt-carousel-wrap .gt-carousel-exit{position:absolute;top:0;left:0;width:100%;animation:gt-carousel-out .56s cubic-bezier(.65,0,.35,1) both;}
.gt-carousel-wrap .gt-carousel-enter{position:absolute;top:0;left:0;width:100%;animation:gt-carousel-in .56s cubic-bezier(.65,0,.35,1) both;}
@keyframes gt-carousel-out{to{transform:translateX(var(--gt-dir-exit,-100%));opacity:.35;}}
@keyframes gt-carousel-in{from{transform:translateX(var(--gt-dir,100%));opacity:.5;}to{transform:translateX(0);opacity:1;}}
.slot.gt-settled{animation:none;}
.slot-head{display:flex;align-items:center;justify-content:space-between;padding:16px 14px 10px;}
.slot-nav{display:flex;align-items:center;gap:8px;}
.swipe-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--border-strong);background:linear-gradient(180deg,#4c4f55 0%,#2a2b2e 55%,#1a1b1d 100%);box-shadow:0 1px 0 rgba(255,255,255,.16) inset,0 -2px 3px rgba(0,0,0,.5) inset,0 2px 5px -1px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--steel);transition:transform .12s ease,background .15s ease;}
.swipe-btn:active{transform:scale(.9);box-shadow:0 2px 4px rgba(0,0,0,.6) inset;}
.swipe-btn svg{width:13px;height:13px;}
.swipe-dots{display:flex;gap:5px;}
.swipe-dots span{width:5px;height:5px;border-radius:50%;background:var(--border-strong);transition:background .2s ease;}
.swipe-dots span.on{background:var(--accent);}
.slot-actions{display:flex;gap:8px;}
.icon-btn{border:none;background:transparent;color:var(--muted-2);cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:background .15s ease,color .15s ease,transform .12s ease;}
.icon-btn:active{transform:scale(.9);}
.icon-btn:hover{background:var(--panel-2);color:var(--steel);}
.icon-btn svg{width:15px;height:15px;}
.exercise-name{font-family:'Barlow Condensed';font-weight:700;font-size:20px;padding:2px 16px 12px;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.exercise-name[contenteditable="true"]{outline:none;border-bottom:1px dashed var(--border-strong);}
.sets-wrap{padding:2px 16px 18px;}
.set-row{display:grid;grid-template-columns:22px 1fr 1fr 26px;gap:10px;align-items:center;margin-bottom:10px;}
.set-row .idx{font-size:12px;color:var(--muted-2);font-weight:600;text-align:center;}
.set-row input,.set-row select{width:100%;border:1px solid var(--border);border-radius:9px;padding:10px 9px;font-family:'Inter';font-size:14px;font-weight:600;background:var(--panel-2);color:var(--ink);transition:border-color .15s ease,background .15s ease;}
.set-row input:focus,.set-row select:focus{outline:none;border-color:var(--accent);background:#202226;}
.set-row .rm{background:transparent;border:none;color:var(--muted-2);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.set-row .rm svg{width:13px;height:13px;}
.set-field-labels{display:grid;grid-template-columns:22px 1fr 1fr 26px;gap:10px;margin-bottom:9px;}
.set-field-labels span{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted-2);font-weight:700;text-align:center;}
.slot-footer{display:flex;gap:10px;padding:6px 16px 18px;}
.btn{font-family:'Inter';font-weight:700;font-size:13px;border-radius:9px;padding:11px 12px;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .12s ease,background .15s ease,filter .15s ease;}
.btn:active{transform:scale(.97);}
.btn svg{width:15px;height:15px;}
.btn-add-set{background:linear-gradient(180deg,#2c2d31 0%,#1c1d20 60%,#131315 100%);border:1px solid var(--border-strong);box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 2px 5px -1px rgba(0,0,0,.5);color:var(--steel-dark);flex:1;}
.btn-add-set:hover{border-color:var(--accent);}
.btn-add-set:active{box-shadow:0 2px 4px rgba(0,0,0,.6) inset;}
.btn-save{background:linear-gradient(180deg,#f6f8f9 0%,#cdd2d7 45%,#93999f 100%);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 -3px 5px rgba(0,0,0,.25) inset,0 4px 12px -2px rgba(0,0,0,.55);color:#0c0c0d;flex:1.4;}
.btn-save:hover{filter:brightness(1.05);}
.btn-save:active{box-shadow:0 2px 6px rgba(0,0,0,.5) inset;transform:scale(.97);}
.btn-save.saved{background:linear-gradient(180deg,#a9ecc6 0%,#6fcf97 50%,#3f8d63 100%);box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 -3px 5px rgba(0,0,0,.25) inset,0 4px 12px -2px rgba(0,0,0,.55);color:#06180f;}
.logged-badge{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;color:var(--ok);background:rgba(127,217,166,.12);border:1px solid rgba(127,217,166,.35);padding:2px 7px;border-radius:999px;}
.measure-form{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;}
.measure-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
.field input{border:1px solid var(--border);border-radius:9px;padding:10px 11px;font-family:'Inter';font-weight:600;font-size:14px;background:var(--panel-2);color:var(--ink);transition:border-color .15s ease,background .15s ease;}
.field input:focus{outline:none;border-color:var(--accent);background:#202226;}
.chart-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-top:20px;}
.chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.ls-weight{text-align:center;font-family:'Barlow Condensed';font-weight:800;font-size:34px;color:var(--steel-dark);line-height:1;}
.ls-sub{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 16px;}
.ls-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;}
.ls-item{display:flex;justify-content:space-between;align-items:center;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:9px 12px;}
.ls-label{font-size:12px;font-weight:600;color:var(--muted);}
.ls-val{font-size:13.5px;font-weight:700;color:var(--steel-dark);}
select{border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-family:'Inter';font-weight:600;font-size:13px;background:var(--panel-2);color:var(--ink);}
.history-list{margin-top:12px;}
.history-row{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px solid var(--border);font-size:13px;}
.history-row .hd{color:var(--muted);font-weight:600;}
.history-row .hv{font-weight:700;color:var(--steel-dark);}
.history-row .del{color:var(--muted-2);background:none;border:none;cursor:pointer;display:flex;align-items:center;margin-left:8px;}
.history-row .del svg{width:13px;height:13px;}
.evo-item{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 16px;margin-bottom:12px;cursor:pointer;animation:gt-risein .5s cubic-bezier(.16,1,.3,1) both;transition:border-color .15s ease;}
.evo-item:hover{border-color:var(--border-strong);}
.evo-top{display:flex;justify-content:space-between;align-items:center;}
.evo-name{font-family:'Barlow Condensed';font-weight:700;font-size:17px;color:var(--ink);}
.evo-max{font-family:'Barlow Condensed';font-weight:800;font-size:20px;color:var(--steel-dark);}
.evo-max span{font-size:11px;color:var(--muted);font-weight:600;font-family:'Inter';}
.evo-meta{font-size:11.5px;color:var(--muted-2);margin-top:2px;}
.evo-chart-wrap{margin-top:10px;display:none;}
.evo-chart-wrap.open{display:block;}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted-2);}
.empty-state svg{width:40px;height:40px;stroke:var(--muted-2);margin-bottom:10px;}
.empty-state p{font-size:13.5px;margin:0;}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--chrome1);color:var(--ink);border:1px solid var(--border-strong);font-size:13px;font-weight:600;padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:100;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:200;}
.modal-overlay.open{display:flex;}
.modal-box{background:var(--panel);width:100%;max-width:520px;max-height:78vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px 26px;box-shadow:0 -10px 40px rgba(0,0,0,.6);border-top:1px solid var(--border-strong);}
.modal-title{font-family:'Barlow Condensed';font-weight:800;font-size:21px;color:var(--steel-dark);display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;position:sticky;top:0;background:var(--panel);padding-bottom:8px;}
.modal-close{background:linear-gradient(180deg,#4c4f55 0%,#2a2b2e 55%,#1a1b1d 100%);box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 -2px 3px rgba(0,0,0,.5) inset,0 2px 5px -1px rgba(0,0,0,.6);border:1px solid var(--border-strong);width:30px;height:30px;border-radius:50%;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;}
.modal-close svg{width:13px;height:13px;}
.modal-zone-title{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin:14px 2px 6px;}
.modal-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 13px;border:1px solid var(--border);border-radius:10px;margin-bottom:7px;cursor:pointer;background:var(--panel-2);transition:border-color .15s ease,background .15s ease;}
.modal-item:hover{border-color:var(--accent);background:#202226;}
.modal-item .name{font-weight:600;font-size:14px;color:var(--ink);}
.modal-item .star{color:var(--steel-dark);display:inline-flex;}
.modal-item .star svg{width:13px;height:13px;}
.already-tag{font-size:10px;font-weight:700;color:var(--muted-2);text-transform:uppercase;letter-spacing:.03em;}
.modal-empty{color:var(--muted-2);font-size:13px;padding:10px 2px;}

class Component extends DCLogic {
  constructor(props){
    super(props);
    this.rootRef = React.createRef();
  }

  componentDidMount(){
    let styleTag = document.getElementById('gt-style');
    if(!styleTag){ styleTag = document.createElement('style'); styleTag.id = 'gt-style'; document.head.appendChild(styleTag); }
    styleTag.textContent = GT_STYLE;

    const bgMotion = this.props.backgroundMotion ?? true;
    const cardAnim = this.props.cardAnimations ?? true;
    document.body.classList.toggle('gt-no-bgmotion', !bgMotion);
    document.body.classList.toggle('gt-no-cardanim', !cardAnim);

    const root = this.rootRef.current;
    root.innerHTML = GT_BODY_HTML;
    function $(sel){ return root.querySelector(sel); }
    function $$(sel){ return root.querySelectorAll(sel); }

    const useCloud = (typeof window.storage !== 'undefined');
    async function storageGet(key){
      try{
        if(useCloud){ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }
        else{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
      }catch(e){ return null; }
    }
    async function storageSet(key, value){
      try{
        if(useCloud){ await window.storage.set(key, JSON.stringify(value), true); }
        else{ localStorage.setItem(key, JSON.stringify(value)); }
      }catch(e){ console.error('storage error', e); }
    }

    function E(name, star){ return {name, star: !!star}; }
    function WARMUP(){ return [E('Elíptica'), E('Bicicleta'), E('Cinta'), E('Remo')]; }

    const MUSCLES = {
      'Pecho': [
        ['Pectoral superior', [E('Press inclinado con mancuernas',1), E('Press inclinado con barra',1), E('Press inclinado en máquina'), E('Cruce de poleas de abajo hacia arriba'), E('Aperturas inclinadas con mancuernas')]],
        ['Pectoral medio', [E('Press banca con barra',1), E('Press plano con mancuernas',1), E('Press en máquina convergente'), E('Aperturas en máquina (Pec Deck)'), E('Aperturas con mancuernas')]],
        ['Pectoral inferior', [E('Fondos inclinando el torso',1), E('Press declinado'), E('Cruce de poleas de arriba hacia abajo')]]
      ],
      'Bíceps': [
        ['Cabeza larga', [E('Curl inclinado con mancuernas',1), E('Curl con barra recta',1), E('Curl en polea por detrás del cuerpo'), E('Curl tipo Drag Curl')]],
        ['Cabeza corta', [E('Curl predicador',1), E('Curl Scott en máquina'), E('Curl con barra EZ agarre cerrado'), E('Curl concentrado')]],
        ['Braquial', [E('Curl martillo',1), E('Curl martillo con cuerda'), E('Curl cruzado (Cross Body Hammer Curl)')]],
        ['Braquiorradial', [E('Curl inverso con barra EZ'), E('Curl inverso en polea')]]
      ],
      'Espalda': [
        ['Dorsal ancho', [E('Dominadas',1), E('Jalón al pecho',1), E('Jalón unilateral'), E('Pullover en polea')]],
        ['Espalda media', [E('Remo con barra',1), E('Remo con mancuerna',1), E('Remo sentado en polea'), E('Remo en máquina Hammer')]],
        ['Espalda alta', [E('Face Pull',1), E('Remo alto en polea'), E('Pájaros en máquina')]],
        ['Trapecio superior', [E('Encogimientos con mancuernas',1), E('Encogimientos con barra')]],
        ['Erectores lumbares', [E('Peso muerto rumano',1), E('Hiperextensiones')]]
      ],
      'Tríceps': [
        ['Cabeza larga', [E('Extensión por encima de la cabeza con cuerda',1), E('Press francés',1), E('Extensión unilateral con mancuerna')]],
        ['Cabeza lateral', [E('Jalón en polea con barra',1), E('Jalón con barra V'), E('Fondos en máquina')]],
        ['Cabeza medial', [E('Jalón con agarre invertido'), E('Press cerrado')]]
      ],
      'Hombros': [
        ['Deltoides anterior', [E('Press militar',1), E('Press con mancuernas',1), E('Elevaciones frontales')]],
        ['Deltoides lateral', [E('Elevaciones laterales',1), E('Elevaciones laterales en polea'), E('Elevaciones laterales en máquina')]],
        ['Deltoides posterior', [E('Pájaros con mancuernas',1), E('Reverse Pec Deck',1), E('Face Pull')]]
      ],
      'Core': [
        ['Recto abdominal', [E('Crunch en polea',1), E('Elevaciones de piernas colgado',1), E('Crunch en máquina'), E('Ab Wheel')]],
        ['Oblicuos', [E('Pallof Press'), E('Wood Chop en polea'), E('Plancha lateral')]],
        ['Transverso abdominal', [E('Plancha',1), E('Hollow Hold'), E('Dead Bug')]]
      ],
      'Piernas': [
        ['Cuádriceps', [E('Sentadilla',1), E('Prensa',1), E('Sentadilla Hack',1), E('Zancadas'), E('Sentadilla búlgara'), E('Extensión de cuádriceps')]],
        ['Isquiotibiales', [E('Peso muerto rumano',1), E('Curl femoral tumbado',1), E('Curl femoral sentado'), E('Buenos días')]],
        ['Glúteos', [E('Hip Thrust',1), E('Sentadilla profunda',1), E('Patada de glúteo en polea'), E('Abducción en máquina')]],
        ['Aductores', [E('Máquina de aductores'), E('Sentadilla sumo')]],
        ['Abductores', [E('Máquina de abductores'), E('Paseo del monstruo con banda')]],
        ['Gemelos', [E('Elevación de gemelos de pie',1), E('Elevación de gemelos sentado',1), E('Gemelos en prensa')]]
      ]
    };

    function principalSlots(muscleNames){
      const slots = [];
      muscleNames.forEach(m=>{
        MUSCLES[m].forEach(([zone, alts], i)=>{
          slots.push({id:'p-'+m+'-'+i, cat:'principal', muscle:m, zone, alts: alts.map(a=>({...a}))});
        });
      });
      return slots;
    }

    const STRETCHES = {
      'Pecho': [E('Estiramiento de pectoral en puerta'), E('Estiramiento de pectoral cruzado')],
      'Bíceps': [E('Estiramiento de bíceps con brazo extendido'), E('Estiramiento de bíceps en pared')],
      'Espalda': [E('Estiramiento de dorsal (gato-camello)'), E('Estiramiento de dorsal colgado en barra')],
      'Tríceps': [E('Estiramiento de tríceps por detrás de la cabeza'), E('Estiramiento de tríceps cruzado')],
      'Hombros': [E('Estiramiento de hombro cruzado'), E('Estiramiento de hombro por detrás de la espalda')],
      'Core': [E('Postura del niño (zona lumbar)'), E('Estiramiento tipo cobra')],
      'Piernas': [E('Estiramiento de cuádriceps'), E('Estiramiento de isquiotibiales'), E('Estiramiento de gemelos')]
    };
    function stretchSlots(muscleNames){
      return muscleNames.map(m=>({id:'e-'+m, cat:'estiramiento', muscle:m, alts:(STRETCHES[m]||[E('Estiramiento general')]).map(a=>({...a}))}));
    }

    function pickSlot(muscle, zoneIndex){
      const [zone, alts] = MUSCLES[muscle][zoneIndex];
      return {id:'p-'+muscle+'-fb-'+zoneIndex, cat:'principal', muscle, zone, alts: alts.map(a=>({...a}))};
    }
    function fullBodySlots(){
      return [pickSlot('Pecho', 1), pickSlot('Espalda', 1), pickSlot('Piernas', 0), pickSlot('Hombros', 0), pickSlot('Core', 2)];
    }

    function defaultProgram(){
      return {
        days:[
          {id:'d1', name:'Día 1', subtitle:'Pecho y bíceps', slots:[{id:'s1', cat:'calentamiento', alts:WARMUP()}, ...principalSlots(['Pecho','Bíceps']), ...stretchSlots(['Pecho','Bíceps'])]},
          {id:'d2', name:'Día 2', subtitle:'Espalda y tríceps', slots:[{id:'s1', cat:'calentamiento', alts:WARMUP()}, ...principalSlots(['Espalda','Tríceps']), ...stretchSlots(['Espalda','Tríceps'])]},
          {id:'d3', name:'Día 3', subtitle:'Hombros y core', slots:[{id:'s1', cat:'calentamiento', alts:WARMUP()}, ...principalSlots(['Hombros','Core']), ...stretchSlots(['Hombros','Core'])]},
          {id:'d4', name:'Día 4', subtitle:'Piernas', slots:[{id:'s1', cat:'calentamiento', alts:WARMUP()}, ...principalSlots(['Piernas']), ...stretchSlots(['Piernas'])]},
          {id:'d5', name:'Día 5', subtitle:'Full body', slots:[{id:'s1', cat:'calentamiento', alts:WARMUP()}, ...fullBodySlots(), ...stretchSlots(['Pecho','Espalda','Piernas','Hombros','Core'])]}
        ]
      };
    }
    const CAT_LABELS = {calentamiento:'Calentamiento', principal:'Ejercicios musculares', estiramiento:'Estiramientos'};

    const FIELD_CONFIG = {
      calentamiento: [{key:'minutos', label:'Min', type:'number', placeholder:'min'}, {key:'intensidad', label:'Intensidad', type:'select', options:['Baja','Media','Alta']}],
      principal: [{key:'reps', label:'Reps', type:'number', placeholder:'reps'}, {key:'weight', label:'Kg', type:'number', placeholder:'kg'}],
      estiramiento: []
    };
    function emptySet(cat){ const o = {}; FIELD_CONFIG[cat].forEach(f=>o[f.key]=''); return o; }
    const MEASURE_FIELDS = [
      {key:'peso', label:'Peso (kg)'}, {key:'pecho', label:'Pecho (cm)'}, {key:'cintura', label:'Cintura (cm)'},
      {key:'cadera', label:'Cadera (cm)'}, {key:'biceps', label:'Bíceps (cm)'}, {key:'muslo', label:'Muslo (cm)'}, {key:'gemelo', label:'Gemelo (cm)'}
    ];

    let state = { tab:'ejercicios', program:null, activeDayId:'d1', slotIndex:{}, pendingSets:{}, logs:[], measures:[], openEvo:null };

    function todayStr(){ return new Date().toISOString().slice(0,10); }
    function fmtDate(d){ const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('es-ES', {day:'2-digit', month:'short'}); }
    function showToast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 1600); }

    const PROGRAM_VERSION = 4;
    async function loadProgram(){
      const v = await storageGet('program-version');
      let p = await storageGet('program-structure');
      if(!p || v !== PROGRAM_VERSION){ p = defaultProgram(); await storageSet('program-structure', p); await storageSet('program-version', PROGRAM_VERSION); }
      state.program = p;
    }
    async function saveProgram(){ await storageSet('program-structure', state.program); }
    async function loadData(){
      let logs = await storageGet('logs');
      let measures = await storageGet('measures');
      if(!logs){
        const oldD = (await storageGet('logs:Dioni')) || [];
        const oldC = (await storageGet('logs:Carlos')) || [];
        logs = [...oldD, ...oldC];
        if(logs.length) await storageSet('logs', logs);
      }
      if(!measures){
        const oldD = (await storageGet('measures:Dioni')) || [];
        const oldC = (await storageGet('measures:Carlos')) || [];
        measures = [...oldD, ...oldC];
        if(measures.length) await storageSet('measures', measures);
      }
      state.logs = logs || [];
      state.measures = measures || [];
      if(state.measures.length < 3){
        const d = (daysAgo)=>{ const dt = new Date(); dt.setDate(dt.getDate()-daysAgo); return dt.toISOString().slice(0,10); };
        const existingDates = new Set(state.measures.map(m=>m.date));
        const demo = [
          {id:Date.now()-30003, date:d(21), peso:82, pecho:104, cintura:88, cadera:98, biceps:36, muslo:58, gemelo:38},
          {id:Date.now()-30002, date:d(14), peso:81.2, pecho:104.5, cintura:87, cadera:98, biceps:36.5, muslo:58.5, gemelo:38.2},
          {id:Date.now()-30001, date:d(7), peso:80.5, pecho:105, cintura:86, cadera:97.5, biceps:37, muslo:59, gemelo:38.5},
          {id:Date.now()-30000, date:d(3), peso:79.8, pecho:105.5, cintura:85, cadera:97, biceps:37.5, muslo:59.5, gemelo:38.7}
        ].filter(m=>!existingDates.has(m.date));
        if(demo.length){
          state.measures = [...state.measures, ...demo];
          await saveMeasures();
        }
      }
      state.pendingSets = {};
    }
    async function saveLogs(){ await storageSet('logs', state.logs); }
    async function saveMeasures(){ await storageSet('measures', state.measures); }

    function renderChrome(){ $$('.tab-btn').forEach(b=>{ b.classList.toggle('active', b.dataset.tab === state.tab); }); }

    function render(){
      renderChrome();
      const main = $('#main');
      if(state.tab === 'ejercicios') main.innerHTML = renderEjercicios();
      else if(state.tab === 'medidas') main.innerHTML = renderMedidas();
      else main.innerHTML = `<button class="add-slot-btn" id="ioBtnEvo" style="margin-bottom:14px;">${ICONS.swap} Exportar / importar datos</button>` + renderEvolucion();
      attachTabHandlers();
    }

    function renderEjercicios(){
      const day = state.program.days.find(d=>d.id===state.activeDayId);
      const daysHtml = state.program.days.map(d=>`
        <div class="day-chip ${d.id===state.activeDayId?'active':''}" data-day="${d.id}">
          <div class="dn">${d.name}</div>
          <div class="ds">${d.subtitle}</div>
        </div>
      `).join('');

      const cats = ['calentamiento','principal','estiramiento'];
      const catsHtml = cats.map(cat=>{
        const slots = day.slots.filter(s=>s.cat===cat);
        if(cat === 'principal'){
          const muscles = [...new Set(slots.map(s=>s.muscle))];
          const groupsHtml = muscles.map(m=>{
            const zoneSlots = slots.filter(s=>s.muscle===m);
            return `
              <div class="muscle-group">
                <div class="muscle-title">${m}</div>
                ${zoneSlots.map(s=>`${s.zone ? `<div class="zone-label">${s.zone}</div>` : ''}${renderSlot(day, s)}`).join('')}
                <button class="add-slot-btn" data-add-zone="${m}">+ añadir ejercicio a ${m}</button>
              </div>
            `;
          }).join('');
          return `<div class="category-block"><div class="category-title">${CAT_LABELS[cat]} <span class="pill">${slots.length}</span></div>${groupsHtml}</div>`;
        }
        if(cat === 'estiramiento'){
          return `<div class="category-block"><div class="category-title">${CAT_LABELS[cat]} <span class="pill">${slots.length}</span></div>${slots.map(s=>`<div class="zone-label">${s.muscle}</div>${renderSlot(day, s)}`).join('')}</div>`;
        }
        return `<div class="category-block"><div class="category-title">${CAT_LABELS[cat]} <span class="pill">${slots.length}</span></div>${slots.map(s=>renderSlot(day, s)).join('')}</div>`;
      }).join('');

      return `<div class="section-label">Elige tu día</div><div class="day-row">${daysHtml}</div>${catsHtml}`;
    }

    function slotLoggedToday(slotId){ const t = todayStr(); return state.logs.find(l=>l.date===t && l.slotId===slotId); }

    function renderSlot(day, slot){
      const idx = state.slotIndex[slot.id] || 0;
      const curAlt = slot.alts[idx % slot.alts.length];
      const exName = curAlt.name;
      const isStar = !!curAlt.star;
      const loggedEntry = slotLoggedToday(slot.id);
      const isLoggedThisExercise = loggedEntry && loggedEntry.exercise === exName;
      const fields = FIELD_CONFIG[slot.cat];
      const isCardio = slot.cat === 'calentamiento';
      const showStar = slot.cat === 'principal';
      const hasFields = fields.length > 0;
      const dots = slot.alts.map((_,i)=>`<span class="${i===(idx%slot.alts.length)?'on':''}"></span>`).join('');

      function renderInput(f, value){
        if(f.type === 'select'){
          const opts = f.options.map(o=>`<option value="${o}" ${value===o?'selected':''}>${o}</option>`).join('');
          return `<select data-field="${f.key}"><option value="">${f.label}</option>${opts}</select>`;
        }
        return `<input type="number" inputmode="decimal" placeholder="${f.placeholder}" value="${value}" data-field="${f.key}">`;
      }

      let bodyHtml;
      if(hasFields){
        let sets = state.pendingSets[slot.id];
        if(!sets){
          sets = (loggedEntry && loggedEntry.exercise===exName) ? loggedEntry.sets.map(s=>({...s})) : [emptySet(slot.cat)];
          state.pendingSets[slot.id] = sets;
        }
        const setsHtml = sets.map((s,i)=>`
          <div class="set-row" data-slot="${slot.id}" data-setidx="${i}">
            <span class="idx">${i+1}</span>
            ${renderInput(fields[0], s[fields[0].key])}
            ${renderInput(fields[1], s[fields[1].key])}
            <button class="rm" data-rmset="${i}" title="Quitar">${ICONS.x}</button>
          </div>
        `).join('');
        bodyHtml = `
          <div class="sets-wrap">
            <div class="set-field-labels"><span></span><span>${fields[0].label}</span><span>${fields[1].label}</span><span></span></div>
            ${setsHtml}
            <div class="slot-footer">
              <button class="btn btn-add-set" data-addset="${slot.id}">${isCardio ? '+ tramo' : '+ serie'}</button>
              <button class="btn btn-save ${isLoggedThisExercise?'saved':''}" data-save="${slot.id}">${isLoggedThisExercise?'✓ Guardado':'Guardar'}</button>
            </div>
          </div>
        `;
      }else{
        bodyHtml = `<div class="sets-wrap"><div class="slot-footer"><button class="btn btn-save ${isLoggedThisExercise?'saved':''}" data-donetoggle="${slot.id}">${isLoggedThisExercise?'✓ Hecho hoy':'Marcar como hecho'}</button></div></div>`;
      }

      return `
        <div class="slot" data-slot-id="${slot.id}">
          ${isLoggedThisExercise ? '<div class="logged-badge">Registrado hoy</div>' : ''}
          <div class="slot-head">
            <div class="slot-nav">
              <button class="swipe-btn" data-swipe="${slot.id}:-1">${ICONS.chevLeft}</button>
              <div class="swipe-dots">${dots}</div>
              <button class="swipe-btn" data-swipe="${slot.id}:1">${ICONS.chevRight}</button>
            </div>
            <div class="slot-actions">
              ${showStar ? `<button class="icon-btn ${isStar?'star-active':''}" data-togglestar="${slot.id}" title="Marcar como ejercicio estrella para hipertrofia">${ICONS.starOutline}</button>` : ''}
              ${slot.cat!=='calentamiento' ? `<button class="delete-btn" data-deleteslot="${slot.id}" title="Eliminar este ejercicio de hoy">${ICONS.x}</button>` : ''}
            </div>
          </div>
          <div class="exercise-name">${exName}${isStar ? ` <span class="star-mark">${ICONS.starFilled}</span>` : ''}</div>
          ${bodyHtml}
        </div>
      `;
    }

    function openAddExerciseModal(muscle){
      const day = state.program.days.find(d=>d.id===state.activeDayId);
      const present = new Set(day.slots.filter(s=>s.cat==='principal' && s.muscle===muscle).flatMap(s=>s.alts.map(a=>a.name)));
      const zones = MUSCLES[muscle] || [];
      let html = `<div class="modal-title">${muscle} <button class="modal-close" id="modalCloseBtn">${ICONS.x}</button></div>
        <p class="io-desc">Elige un ejercicio para añadir como tarjeta extra hoy — útil si vas con ganas de más.</p>`;
      zones.forEach(([zone, alts])=>{
        html += `<div class="modal-zone-title">${zone}</div>`;
        alts.forEach(a=>{
          const already = present.has(a.name);
          html += `<div class="modal-item" data-pick-zone="${zone}" data-pick-name="${a.name}" data-pick-star="${a.star?1:0}">
            <span class="name">${a.name}${already ? ' <span class="already-tag">ya en tu día</span>' : ''}</span>${a.star?`<span class="star">${ICONS.starFilled}</span>`:''}
          </div>`;
        });
      });
      const box = $('#modalBox');
      box.innerHTML = html;
      $('#modalOverlay').classList.add('open');
      $('#modalCloseBtn').addEventListener('click', closeModal);
      box.querySelectorAll('[data-pick-name]').forEach(el=>{
        el.addEventListener('click', ()=>{
          addExerciseToDay(muscle, el.dataset.pickZone, el.dataset.pickName, el.dataset.pickStar==='1');
          closeModal();
        });
      });
    }
    function closeModal(){ $('#modalOverlay').classList.remove('open'); }
    function addExerciseToDay(muscle, zone, name, star){
      const day = state.program.days.find(d=>d.id===state.activeDayId);
      const slot = {id:'p-'+Date.now(), cat:'principal', muscle, zone, alts:[{name, star}]};
      day.slots.push(slot);
      saveProgram(); render();
    }
    $('#modalOverlay').addEventListener('click', (e)=>{ if(e.target.id === 'modalOverlay') closeModal(); });

    function openIoModal(){
      const box = $('#modalBox');
      box.innerHTML = `
        <div class="modal-title">Copia de seguridad <button class="modal-close" id="modalCloseBtn">${ICONS.x}</button></div>
        <p class="io-desc">Descarga toda tu información (ejercicios registrados, medidas y tu programa personalizado) en un Excel. Si algún día pierdes la app o cambias de móvil, puedes volver a cargarlo desde aquí.</p>
        <button class="btn btn-save" style="width:100%; margin-top:6px;" id="exportBtn">${ICONS.download} Exportar a Excel</button>
        <div class="io-divider">o</div>
        <label class="btn btn-add-set" style="width:100%; cursor:pointer;" id="importLabel">${ICONS.upload} Importar desde Excel</label>
        <input type="file" id="importInput" accept=".xlsx" style="display:none;">
        <p class="io-warn">Importar sustituye los datos que tengas ahora mismo en este móvil.</p>
      `;
      $('#modalOverlay').classList.add('open');
      $('#modalCloseBtn').addEventListener('click', closeModal);
      $('#exportBtn').addEventListener('click', exportExcel);
      $('#importInput').addEventListener('change', (e)=>{ const file = e.target.files[0]; if(file) importExcel(file); });
    }

    function exportExcel(){
      const wb = XLSX.utils.book_new();
      const logsRows = [];
      state.logs.forEach(l=>{
        const isCardio = l.cat === 'calentamiento';
        if(!l.sets || !l.sets.length){
          logsRows.push({Fecha:l.date, Categoria:l.cat, Musculo:l.muscle||'', Ejercicio:l.exercise, Serie:'Hecho', 'Reps o Minutos':'', 'Kg o Intensidad':''});
        }else{
          l.sets.forEach((s,i)=>{
            logsRows.push({Fecha:l.date, Categoria:l.cat, Musculo:l.muscle||'', Ejercicio:l.exercise, Serie:i+1,
              'Reps o Minutos': isCardio ? (s.minutos||'') : (s.reps||''), 'Kg o Intensidad': isCardio ? (s.intensidad||'') : (s.weight||'')});
          });
        }
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(logsRows), 'Registros');
      const measRows = state.measures.map(m=>({
        Fecha:m.date, 'Peso (kg)':m.peso||'', 'Pecho (cm)':m.pecho||'', 'Cintura (cm)':m.cintura||'', 'Cadera (cm)':m.cadera||'',
        'Bíceps (cm)':m.biceps||'', 'Muslo (cm)':m.muslo||'', 'Gemelo (cm)':m.gemelo||''
      }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(measRows), 'Medidas');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{programaJSON: JSON.stringify(state.program)}]), 'Programa');
      XLSX.writeFile(wb, 'gym-tracker-backup-'+todayStr()+'.xlsx');
      closeModal();
    }

    async function importExcel(file){
      try{
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, {type:'array'});
        const logsSheet = wb.Sheets['Registros'];
        if(logsSheet){
          const rows = XLSX.utils.sheet_to_json(logsSheet);
          const grouped = new Map();
          rows.forEach(r=>{
            const fecha = String(r.Fecha||'');
            const cat = r.Categoria||'';
            const muscle = r.Musculo||'';
            const exercise = r.Ejercicio||'';
            const key = fecha+'|'+cat+'|'+muscle+'|'+exercise;
            if(!grouped.has(key)) grouped.set(key, {date:fecha, cat, muscle: muscle||undefined, exercise, sets:[]});
            const isCardio = cat === 'calentamiento';
            const v1 = r['Reps o Minutos'], v2 = r['Kg o Intensidad'];
            if(r.Serie !== 'Hecho' && (v1!==undefined && v1!=='' || v2!==undefined && v2!=='')){
              grouped.get(key).sets.push(isCardio ? {minutos:v1||'', intensidad:v2||''} : {reps:v1||'', weight:v2||''});
            }
          });
          state.logs = [...grouped.values()].map((l,i)=>({...l, id:Date.now()+'-'+i}));
          await saveLogs();
        }
        const measSheet = wb.Sheets['Medidas'];
        if(measSheet){
          const rows = XLSX.utils.sheet_to_json(measSheet);
          state.measures = rows.map((r,i)=>({
            id: Date.now()+i, date: String(r.Fecha||''),
            peso:r['Peso (kg)']||'', pecho:r['Pecho (cm)']||'', cintura:r['Cintura (cm)']||'', cadera:r['Cadera (cm)']||'',
            biceps:r['Bíceps (cm)']||'', muslo:r['Muslo (cm)']||'', gemelo:r['Gemelo (cm)']||''
          }));
          await saveMeasures();
        }
        const progSheet = wb.Sheets['Programa'];
        if(progSheet){
          const rows = XLSX.utils.sheet_to_json(progSheet);
          if(rows[0] && rows[0].programaJSON){ state.program = JSON.parse(rows[0].programaJSON); await saveProgram(); }
        }
        closeModal();
        showToast('Datos importados ✓');
        render();
      }catch(err){
        console.error(err);
        showToast('No se pudo leer el archivo');
      }
    }

    let measuresChart = null;
    function latestSummaryHtml(m){
      const val = (k, suf) => (m && m[k] !== undefined && m[k] !== '' && m[k] != null) ? m[k]+suf : '–';
      return `
        <div class="ls-weight">${val('peso',' kg')}</div>
        <div class="ls-sub">Peso actual</div>
        <div class="ls-grid">
          <div class="ls-item"><span class="ls-label">Pecho</span><span class="ls-val">${val('pecho',' cm')}</span></div>
          <div class="ls-item"><span class="ls-label">Bíceps</span><span class="ls-val">${val('biceps',' cm')}</span></div>
          <div class="ls-item"><span class="ls-label">Cintura</span><span class="ls-val">${val('cintura',' cm')}</span></div>
          <div class="ls-item"><span class="ls-label">Cadera</span><span class="ls-val">${val('cadera',' cm')}</span></div>
          <div class="ls-item"><span class="ls-label">Muslo</span><span class="ls-val">${val('muslo',' cm')}</span></div>
          <div class="ls-item"><span class="ls-label">Gemelo</span><span class="ls-val">${val('gemelo',' cm')}</span></div>
        </div>
      `;
    }
    function renderMedidas(){
      const fieldsHtml = MEASURE_FIELDS.map(f=>`<div class="field"><label>${f.label}</label><input type="number" inputmode="decimal" id="mf-${f.key}" placeholder="—"></div>`).join('');
      const sorted = [...state.measures].sort((a,b)=>a.date.localeCompare(b.date));
      const latest = sorted.length ? sorted[sorted.length-1] : {};
      const options = MEASURE_FIELDS.map(f=>`<option value="${f.key}">${f.label}</option>`).join('');
      const historyHtml = sorted.length ? [...sorted].reverse().map(m=>`
        <div class="history-row">
          <span class="hd">${fmtDate(m.date)}</span>
          <span class="hv">${MEASURE_FIELDS.filter(f=>m[f.key]!=='' && m[f.key]!=null).map(f=>`${f.label.split(' ')[0]}: ${m[f.key]}`).join(' · ') || '—'}</span>
          <button class="del" data-delmeasure="${m.id}">${ICONS.x}</button>
        </div>
      `).join('') : `<div class="empty-state"><p>Aún no hay medidas registradas.</p></div>`;
      return `
        <div class="chart-card">${sorted.length ? latestSummaryHtml(latest) : '<div class="empty-state"><p>Registra tus medidas para verlas aquí.</p></div>'}</div>
        <div class="section-label">Registrar hoy</div>
        <div class="measure-form">
          <div class="measure-grid">${fieldsHtml}</div>
          <button class="btn btn-save" style="width:100%; margin-top:12px;" id="saveMeasureBtn">Guardar medidas de hoy</button>
        </div>
        <div class="chart-card">
          <div class="chart-head"><strong style="font-family:'Barlow Condensed'; font-size:16px;">Evolución</strong><select id="measureMetric">${options}</select></div>
          <canvas id="measuresCanvas" height="180"></canvas>
        </div>
        <div class="section-label">Historial</div>
        <div class="history-list">${historyHtml}</div>
      `;
    }

    function drawMeasuresChart(metric){
      const canvas = $('#measuresCanvas');
      if(!canvas) return;
      const sorted = [...state.measures].filter(m=>m[metric]!=='' && m[metric]!=null).sort((a,b)=>a.date.localeCompare(b.date));
      if(measuresChart){ measuresChart.destroy(); }
      measuresChart = new Chart(canvas, {
        type:'line',
        data:{ labels: sorted.map(m=>fmtDate(m.date)), datasets:[{ data: sorted.map(m=>m[metric]), borderColor:'#f2f6f8', backgroundColor:'rgba(230,240,245,0.1)', borderWidth:2.5, pointRadius:3.5, pointBackgroundColor:'#f2f6f8', pointBorderColor:'#f2f6f8', tension:.3, fill:true }] },
        options:{ plugins:{legend:{display:false}}, scales:{ y:{grid:{color:'rgba(255,255,255,.08)'}, ticks:{color:'#9a9da3', font:{size:11}}}, x:{grid:{display:false}, ticks:{color:'#9a9da3', font:{size:11}}} } },
        plugins:[{
          id:'gtNeonGlow',
          beforeDatasetsDraw(chart){ const ctx = chart.ctx; ctx.save(); ctx.shadowColor='rgba(210,230,255,0.95)'; ctx.shadowBlur=14; },
          afterDatasetsDraw(chart){ chart.ctx.restore(); }
        }]
      });
    }

    function renderEvolucion(){
      const relevant = state.logs.filter(l=>l.cat!=='estiramiento');
      const groupOf = l => l.cat==='calentamiento' ? 'Calentamiento' : (l.muscle || 'Otros');
      const keyOf = l => groupOf(l)+'|'+l.exercise;
      const keys = [...new Set(relevant.map(keyOf))];
      if(!keys.length){
        return `<div class="empty-state">${ICONS.trend}<p>Cuando registres series en la pestaña Ejercicios,<br>aquí verás tu progreso por ejercicio.</p></div>`;
      }
      const groups = {};
      keys.forEach(k=>{ const group = k.split('|')[0]; (groups[group] = groups[group] || []).push(k); });
      const groupNames = Object.keys(groups).sort((a,b)=> a==='Calentamiento' ? -1 : b==='Calentamiento' ? 1 : a.localeCompare(b,'es'));
      return groupNames.map(group=>{
        const itemsHtml = groups[group].sort().map(key=>{
          const name = key.split('|')[1];
          const entries = relevant.filter(l=>keyOf(l)===key);
          const isCardio = entries[0].cat === 'calentamiento';
          let maxV = 0, lastDate = '';
          entries.forEach(e=>{
            e.sets.forEach(s=>{ const v = parseFloat(isCardio ? s.minutos : s.weight); if(!isNaN(v) && v>maxV) maxV = v; });
            if(e.date > lastDate) lastDate = e.date;
          });
          const isOpen = state.openEvo === key;
          return `
            <div class="evo-item" data-evo="${key}">
              <div class="evo-top">
                <div>
                  <div class="evo-name">${name}</div>
                  <div class="evo-meta">Última vez: ${fmtDate(lastDate)} · ${entries.length} sesión(es)</div>
                </div>
                <div class="evo-max">${maxV || '–'}<span> ${isCardio ? 'min máx' : 'kg máx'}</span></div>
              </div>
              <div class="evo-chart-wrap ${isOpen?'open':''}" id="evoChartWrap-${cssId(key)}"><canvas id="evoCanvas-${cssId(key)}" height="140"></canvas></div>
            </div>
          `;
        }).join('');
        return `<div class="muscle-group"><div class="muscle-title">${group}</div>${itemsHtml}</div>`;
      }).join('');
    }
    function cssId(s){ return s.replace(/[^a-zA-Z0-9]/g,'_'); }

    let evoCharts = {};
    function drawEvoChart(key){
      const canvas = $('#evoCanvas-'+cssId(key));
      if(!canvas) return;
      const [group, name] = key.split('|');
      const entries = state.logs.filter(l=>(l.cat==='calentamiento'?'Calentamiento':(l.muscle||'Otros'))===group && l.exercise===name).sort((a,b)=>a.date.localeCompare(b.date));
      const isCardio = entries.length && entries[0].cat === 'calentamiento';
      const data = entries.map(e=>{ let max=0; e.sets.forEach(s=>{const v=parseFloat(isCardio ? s.minutos : s.weight); if(!isNaN(v)&&v>max)max=v;}); return max; });
      if(evoCharts[key]) evoCharts[key].destroy();
      evoCharts[key] = new Chart(canvas, {
        type:'line',
        data:{ labels: entries.map(e=>fmtDate(e.date)), datasets:[{ data, borderColor:'#9aa0a8', backgroundColor:'rgba(154,160,168,0.14)', borderWidth:2.5, pointRadius:3, pointBackgroundColor:'#9aa0a8', tension:.3, fill:true }] },
        options:{ plugins:{legend:{display:false}}, scales:{ y:{grid:{color:'rgba(255,255,255,.08)'}, ticks:{color:'#9a9da3', font:{size:11}}}, x:{grid:{display:false}, ticks:{color:'#9a9da3', font:{size:11}}} } }
      });
    }

    function refreshSlot(slotId){
      const day = state.program.days.find(d=>d.id===state.activeDayId);
      const slot = day.slots.find(s=>s.id===slotId);
      const oldEl = root.querySelector('.slot[data-slot-id="'+slotId+'"]');
      if(!slot || !oldEl){ render(); return null; }
      const tmp = document.createElement('div');
      tmp.innerHTML = renderSlot(day, slot).trim();
      const newEl = tmp.firstElementChild;
      oldEl.replaceWith(newEl);
      bindSlotEvents(newEl);
      return newEl;
    }
    function swapSlot(slotId, dir){
      const day = state.program.days.find(d=>d.id===state.activeDayId);
      const slot = day.slots.find(s=>s.id===slotId);
      const oldEl = root.querySelector('.slot[data-slot-id="'+slotId+'"]');
      if(!slot || !oldEl){ render(); return; }
      const parent = oldEl.parentNode;
      const rect = oldEl.getBoundingClientRect();
      const wrap = document.createElement('div');
      wrap.className = 'gt-carousel-wrap';
      wrap.style.minHeight = rect.height + 'px';
      parent.insertBefore(wrap, oldEl);
      wrap.appendChild(oldEl);

      const tmp = document.createElement('div');
      tmp.innerHTML = renderSlot(day, slot).trim();
      const newEl = tmp.firstElementChild;
      newEl.classList.add('gt-carousel-enter');
      newEl.style.setProperty('--gt-dir', dir>0 ? '100%' : '-100%');
      wrap.appendChild(newEl);
      bindSlotEvents(newEl);

      oldEl.classList.add('gt-carousel-exit');
      oldEl.style.setProperty('--gt-dir-exit', dir>0 ? '-100%' : '100%');

      setTimeout(()=>{
        newEl.classList.remove('gt-carousel-enter');
        newEl.classList.add('gt-settled');
        newEl.style.removeProperty('--gt-dir');
        if(wrap.parentNode){ wrap.replaceWith(newEl); }
      }, 560);
    }
    function bindSlotEvents(el){
      const slotId = el.dataset.slotId;
      el.querySelectorAll('[data-swipe]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const [id, dir] = btn.dataset.swipe.split(':');
          const day = state.program.days.find(d=>d.id===state.activeDayId);
          const slot = day.slots.find(s=>s.id===id);
          const cur = state.slotIndex[id] || 0;
          let next = (cur + parseInt(dir)) % slot.alts.length;
          if(next<0) next += slot.alts.length;
          state.slotIndex[id] = next;
          delete state.pendingSets[id];
          swapSlot(id, parseInt(dir));
        });
      });
      el.querySelectorAll('[data-addset]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const id = btn.dataset.addset;
          const day = state.program.days.find(d=>d.id===state.activeDayId);
          const slot = day.slots.find(s=>s.id===id);
          state.pendingSets[id] = state.pendingSets[id] || [];
          state.pendingSets[id].push(emptySet(slot.cat));
          refreshSlot(id);
        });
      });
      el.querySelectorAll('.set-row input, .set-row select').forEach(inp=>{
        inp.addEventListener('input', ()=>{
          const row = inp.closest('.set-row');
          const idx = parseInt(row.dataset.setidx);
          const field = inp.dataset.field;
          state.pendingSets[slotId][idx][field] = inp.value;
        });
      });
      el.querySelectorAll('.rm[data-rmset]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const idx = parseInt(btn.dataset.rmset);
          const day = state.program.days.find(d=>d.id===state.activeDayId);
          const slot = day.slots.find(s=>s.id===slotId);
          state.pendingSets[slotId].splice(idx,1);
          if(!state.pendingSets[slotId].length) state.pendingSets[slotId].push(emptySet(slot.cat));
          refreshSlot(slotId);
        });
      });
      const saveBtn = el.querySelector('[data-save]');
      if(saveBtn) saveBtn.addEventListener('click', async ()=>{
        const day = state.program.days.find(d=>d.id===state.activeDayId);
        const slot = day.slots.find(s=>s.id===slotId);
        const idx = state.slotIndex[slotId] || 0;
        const exName = slot.alts[idx % slot.alts.length].name;
        const sets = (state.pendingSets[slotId]||[]).filter(s=>Object.values(s).some(v=>v!==''));
        if(!sets.length){ showToast('Añade al menos un dato'); return; }
        const t = todayStr();
        state.logs = state.logs.filter(l=>!(l.date===t && l.slotId===slotId));
        state.logs.push({ id: Date.now()+'-'+slotId, date: t, dayId: day.id, slotId, cat: slot.cat, muscle: slot.muscle, exercise: exName, sets: sets.map(s=>({...s})) });
        await saveLogs();
        showToast('Guardado ✓');
        refreshSlot(slotId);
      });
      const doneBtn = el.querySelector('[data-donetoggle]');
      if(doneBtn) doneBtn.addEventListener('click', async ()=>{
        const day = state.program.days.find(d=>d.id===state.activeDayId);
        const slot = day.slots.find(s=>s.id===slotId);
        const idx = state.slotIndex[slotId] || 0;
        const exName = slot.alts[idx % slot.alts.length].name;
        const t = todayStr();
        const already = state.logs.find(l=>l.date===t && l.slotId===slotId && l.exercise===exName);
        if(already){ state.logs = state.logs.filter(l=>l.id!==already.id); }
        else{ state.logs = state.logs.filter(l=>!(l.date===t && l.slotId===slotId)); state.logs.push({id:Date.now()+'-'+slotId, date:t, dayId:day.id, slotId, cat:slot.cat, muscle:slot.muscle, exercise:exName, sets:[]}); }
        await saveLogs();
        refreshSlot(slotId);
      });
      const starBtn = el.querySelector('[data-togglestar]');
      if(starBtn) starBtn.addEventListener('click', ()=>{
        const day = state.program.days.find(d=>d.id===state.activeDayId);
        const slot = day.slots.find(s=>s.id===slotId);
        const idx = state.slotIndex[slotId] || 0;
        const cur = slot.alts[idx % slot.alts.length];
        cur.star = !cur.star;
        saveProgram();
        refreshSlot(slotId);
      });
      const delBtn = el.querySelector('[data-deleteslot]');
      if(delBtn) delBtn.addEventListener('click', ()=>{
        if(!confirm('¿Quitar este ejercicio de hoy?')) return;
        const day = state.program.days.find(d=>d.id===state.activeDayId);
        day.slots = day.slots.filter(s=>s.id!==slotId);
        delete state.slotIndex[slotId];
        delete state.pendingSets[slotId];
        saveProgram(); render();
      });
    }

    function attachTabHandlers(){
      if(state.tab==='ejercicios'){
        $$('.day-chip').forEach(el=>{ el.addEventListener('click', ()=>{ state.activeDayId = el.dataset.day; render(); }); });
        $$('.slot').forEach(el=>bindSlotEvents(el));
        $$('[data-add-zone]').forEach(el=>{ el.addEventListener('click', ()=>{ openAddExerciseModal(el.dataset.addZone); }); });
      }
      if(state.tab==='medidas'){
        $('#saveMeasureBtn').addEventListener('click', async ()=>{
          const entry = {id:Date.now(), date: todayStr()};
          let any = false;
          MEASURE_FIELDS.forEach(f=>{ const v = $('#mf-'+f.key).value; entry[f.key] = v; if(v!=='') any = true; });
          if(!any){ showToast('Introduce al menos un dato'); return; }
          state.measures = state.measures.filter(m=>m.date!==entry.date);
          state.measures.push(entry);
          await saveMeasures();
          showToast('Medidas guardadas ✓');
          render();
        });
        $$('[data-delmeasure]').forEach(el=>{
          el.addEventListener('click', async ()=>{
            const id = parseInt(el.dataset.delmeasure);
            state.measures = state.measures.filter(m=>m.id!==id);
            await saveMeasures();
            render();
          });
        });
        const metricSel = $('#measureMetric');
        metricSel.addEventListener('change', ()=>drawMeasuresChart(metricSel.value));
        drawMeasuresChart(metricSel.value);
      }
      if(state.tab==='evolucion'){
        $('#ioBtnEvo').addEventListener('click', openIoModal);
        $$('[data-evo]').forEach(el=>{
          el.addEventListener('click', ()=>{
            const name = el.dataset.evo;
            state.openEvo = (state.openEvo===name) ? null : name;
            render();
            if(state.openEvo) setTimeout(()=>drawEvoChart(state.openEvo), 0);
          });
        });
        if(state.openEvo) setTimeout(()=>drawEvoChart(state.openEvo), 0);
      }
    }

    $('.tabbar').addEventListener('click', (e)=>{
      const btn = e.target.closest('.tab-btn');
      if(!btn) return;
      state.tab = btn.dataset.tab;
      state.openEvo = null;
      render();
    });

    (async function init(){ await loadProgram(); await loadData(); render(); })();

    this._gtCleanup = () => {
      document.body.classList.remove('gt-no-bgmotion','gt-no-cardanim');
    };
  }

  componentWillUnmount(){
    if(this._gtCleanup) this._gtCleanup();
  }

  renderVals(){
    return { rootRef: this.rootRef };
  }
}
</script>
</body>
