<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gym Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#eceef0;
    --bg-grad: radial-gradient(1200px 600px at 50% -10%, #f5f6f7 0%, #eceef0 55%, #e3e6e9 100%);
    --panel:#ffffff;
    --panel-2:#f6f7f8;
    --border:#dde1e5;
    --border-strong:#c7ccd2;
    --ink:#1e2228;
    --muted:#6b7280;
    --muted-2:#9aa1a9;
    --steel:#4a5a68;
    --steel-dark:#2c343d;
    --chrome1:#eef0f2;
    --chrome2:#c6cbd1;
    --chrome3:#9aa2ab;
    --accent:#39647f;
    --accent-ink:#ffffff;
    --danger:#a4453a;
    --ok:#3d7a5c;
    --radius:14px;
    --radius-sm:9px;
    --shadow: 0 1px 2px rgba(20,24,29,.06), 0 8px 24px -12px rgba(20,24,29,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-grad);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.display{
    font-family:'Barlow Condensed',system-ui,sans-serif;
    letter-spacing:.01em;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0) 120px);
    padding-bottom:86px;
  }
  /* ---- Header ---- */
  .topbar{
    padding:22px 18px 14px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
  }
  .greeting{
    font-size:30px;
    font-weight:700;
    line-height:1;
    color:var(--steel-dark);
  }
  .greeting .accent-underline{
    display:block;
    width:46px;height:4px;
    margin-top:8px;
    border-radius:2px;
    background:linear-gradient(90deg,var(--chrome3),var(--chrome1));
  }
  /* ---- Tabs (bottom nav) ---- */
  .tabbar{
    position:fixed;
    bottom:0; left:0; right:0;
    max-width:520px;
    margin:0 auto;
    background:rgba(255,255,255,.86);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--border);
    display:flex;
    z-index:50;
  }
  .tab-btn{
    flex:1;
    border:none;
    background:transparent;
    padding:12px 4px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    font-family:'Inter';
    font-weight:600;
    font-size:11.5px;
    color:var(--muted-2);
    cursor:pointer;
  }
  .tab-btn svg{width:22px;height:22px;stroke:var(--muted-2);fill:none;stroke-width:1.8;transition:.15s;}
  .tab-btn.active{color:var(--steel-dark);}
  .tab-btn.active svg{stroke:var(--accent);}
  .tab-btn.active{position:relative;}
  .tab-btn.active::after{
    content:'';
    position:absolute; top:2px; left:50%; transform:translateX(-50%);
    width:26px;height:3px;border-radius:2px;
    background:linear-gradient(90deg,var(--accent),var(--steel));
  }
  main{padding:4px 16px 20px; flex:1;}
  .section-label{
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted); margin:18px 2px 8px;
  }
  /* ---- Day chips ---- */
  .day-row{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 4px; scrollbar-width:none;}
  .day-row::-webkit-scrollbar{display:none;}
  .day-chip{
    flex:0 0 auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 14px;
    cursor:pointer;
    box-shadow:var(--shadow);
    min-width:118px;
  }
  .day-chip .dn{font-family:'Barlow Condensed'; font-weight:700; font-size:15px; color:var(--steel-dark); line-height:1.1;}
  .day-chip .ds{font-size:11.5px; color:var(--muted); margin-top:1px;}
  .day-chip.active{
    background:linear-gradient(135deg,var(--steel),var(--steel-dark));
    border-color:var(--steel-dark);
  }
  .day-chip.active .dn, .day-chip.active .ds{color:#fff;}
  /* ---- Category / slot cards ---- */
  .category-block{margin-top:6px;}
  .category-title{
    display:flex; align-items:center; gap:8px;
    font-family:'Barlow Condensed'; font-weight:700; font-size:17px;
    color:var(--steel-dark); margin:14px 2px 8px;
  }
  .category-title .pill{
    font-family:'Inter'; font-size:10.5px; font-weight:700; color:var(--accent);
    background:#eaf0f3; border:1px solid #d7e2e7; padding:2px 8px; border-radius:999px;
  }
  .muscle-group{margin-top:4px;}
  .muscle-title{
    font-family:'Barlow Condensed'; font-weight:800; font-size:14.5px;
    text-transform:uppercase; letter-spacing:.06em; color:var(--accent);
    margin:16px 2px 2px; padding-bottom:6px; border-bottom:1px solid var(--border-strong);
  }
  .zone-label{
    font-size:11.5px; font-weight:700; color:var(--muted);
    text-transform:uppercase; letter-spacing:.03em;
    margin:12px 2px 5px;
  }
  .star-mark{
    color:#c99a1c; font-size:16px; vertical-align:middle;
  }
  .icon-btn.star-active{color:#c99a1c;}
  .icon-btn.star-active:hover{background:#fff3d6;}
  .add-slot-btn{
    width:100%;
    border:1.5px dashed var(--border-strong);
    background:transparent;
    color:var(--muted);
    border-radius:var(--radius-sm);
    padding:10px;
    font-family:'Inter'; font-weight:600; font-size:13px;
    cursor:pointer;
    margin:8px 0 4px;
  }
  .slot{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    margin-bottom:12px;
    overflow:hidden;
    position:relative;
  }
  .slot-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 12px 6px;
  }
  .slot-nav{display:flex; align-items:center; gap:6px;}
  .swipe-btn{
    width:26px;height:26px;border-radius:50%;
    border:1px solid var(--border-strong);
    background:var(--chrome1);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; color:var(--steel);
    font-size:13px; line-height:1;
  }
  .swipe-dots{display:flex; gap:4px;}
  .swipe-dots span{width:5px;height:5px;border-radius:50%;background:var(--border-strong);}
  .swipe-dots span.on{background:var(--accent);}
  .slot-actions{display:flex; gap:6px;}
  .icon-btn{
    border:none;background:transparent;color:var(--muted-2);cursor:pointer;
    width:26px;height:26px;display:flex;align-items:center;justify-content:center;
    border-radius:7px; font-size:14px;
  }
  .icon-btn:hover{background:var(--panel-2); color:var(--steel);}
  .exercise-name{
    font-family:'Barlow Condensed'; font-weight:700; font-size:19px;
    padding:0 14px; color:var(--ink);
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .exercise-name[contenteditable="true"]{outline:none; border-bottom:1px dashed var(--border-strong);}
  .sets-wrap{padding:10px 12px 12px;}
  .set-row{
    display:grid; grid-template-columns:22px 1fr 1fr 26px; gap:8px; align-items:center;
    margin-bottom:7px;
  }
  .set-row .idx{font-size:12px; color:var(--muted-2); font-weight:600; text-align:center;}
  .set-row input, .set-row select{
    width:100%; border:1px solid var(--border); border-radius:8px;
    padding:8px 8px; font-family:'Inter'; font-size:14px; font-weight:600;
    background:var(--panel-2); color:var(--ink);
  }
  .set-row input:focus, .set-row select:focus{outline:none; border-color:var(--accent); background:#fff;}
  .set-row .rm{background:transparent;border:none;color:var(--muted-2);cursor:pointer;font-size:15px;}
  .set-field-labels{display:grid; grid-template-columns:22px 1fr 1fr 26px; gap:8px; margin-bottom:5px;}
  .set-field-labels span{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted-2); font-weight:700; text-align:center;}
  .slot-footer{display:flex; gap:8px; padding:2px 12px 12px;}
  .btn{
    font-family:'Inter'; font-weight:700; font-size:13px;
    border-radius:9px; padding:9px 12px; cursor:pointer; border:1px solid transparent;
  }
  .btn-add-set{background:var(--panel-2); border:1px solid var(--border); color:var(--steel-dark); flex:1;}
  .btn-save{background:linear-gradient(135deg,var(--accent),#2c4b60); color:#fff; flex:1.4;}
  .btn-save.saved{background:linear-gradient(135deg,var(--ok),#2d5c46);}
  .logged-badge{
    position:absolute; top:10px; right:10px;
    font-size:10px; font-weight:700; color:var(--ok);
    background:#e7f3ec; border:1px solid #cbe6d8; padding:2px 7px; border-radius:999px;
  }
  /* ---- Measures tab ---- */
  .measure-form{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:14px;
  }
  .measure-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .field{display:flex; flex-direction:column; gap:4px;}
  .field label{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}
  .field input{
    border:1px solid var(--border); border-radius:8px; padding:9px 10px;
    font-family:'Inter'; font-weight:600; font-size:14px; background:var(--panel-2); color:var(--ink);
  }
  .field input:focus{outline:none; border-color:var(--accent); background:#fff;}
  .chart-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:14px; margin-top:16px;
  }
  .chart-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .body-figure-card{margin-top:0;}
  .body-figure{width:100%; height:auto; display:block; max-width:220px; margin:0 auto;}
  .bf-shape{fill:var(--chrome2); stroke:var(--border-strong); stroke-width:1.5;}
  .bf-detail{fill:none; stroke:var(--border-strong); stroke-width:1.3; stroke-linecap:round; opacity:.7;}
  .bf-badge{fill:var(--accent); stroke:#fff; stroke-width:2;}
  .bf-badge-n{font-family:'Inter'; font-size:11px; font-weight:800; fill:#fff; text-anchor:middle;}
  .bl-weight{
    text-align:center; font-family:'Barlow Condensed'; font-weight:800; font-size:16px;
    color:var(--accent); margin:12px 0 8px;
  }
  .bl-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 14px;}
  .bl-item{
    font-size:12.5px; font-weight:600; color:var(--ink);
    display:flex; align-items:center; gap:7px;
  }
  .bl-num{
    display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
    width:17px; height:17px; border-radius:50%;
    background:var(--accent); color:#fff; font-size:10px; font-weight:800;
  }
  select{
    border:1px solid var(--border); border-radius:8px; padding:7px 9px; font-family:'Inter';
    font-weight:600; font-size:13px; background:var(--panel-2); color:var(--ink);
  }
  .history-list{margin-top:10px;}
  .history-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 2px; border-bottom:1px solid var(--border);
    font-size:13px;
  }
  .history-row .hd{color:var(--muted); font-weight:600;}
  .history-row .hv{font-weight:700; color:var(--steel-dark);}
  .history-row .del{color:var(--muted-2); background:none; border:none; cursor:pointer; font-size:14px; margin-left:8px;}
  /* ---- Evolution tab ---- */
  .evo-item{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:12px 14px; margin-bottom:10px; cursor:pointer;
  }
  .evo-top{display:flex; justify-content:space-between; align-items:center;}
  .evo-name{font-family:'Barlow Condensed'; font-weight:700; font-size:17px; color:var(--ink);}
  .evo-max{font-family:'Barlow Condensed'; font-weight:800; font-size:20px; color:var(--accent);}
  .evo-max span{font-size:11px; color:var(--muted); font-weight:600; font-family:'Inter';}
  .evo-meta{font-size:11.5px; color:var(--muted-2); margin-top:2px;}
  .evo-chart-wrap{margin-top:10px; display:none;}
  .evo-chart-wrap.open{display:block;}
  .empty-state{
    text-align:center; padding:40px 20px; color:var(--muted-2);
  }
  .empty-state svg{width:40px;height:40px;stroke:var(--muted-2);margin-bottom:10px;}
  .empty-state p{font-size:13.5px; margin:0;}
  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--steel-dark); color:#fff; font-size:13px; font-weight:600;
    padding:10px 16px; border-radius:999px; box-shadow:var(--shadow);
    opacity:0; pointer-events:none; transition:.2s; z-index:100; white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  /* ---- Modal selector de ejercicios ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,24,29,.5);
    display:none; align-items:flex-end; justify-content:center; z-index:200;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:#fff; width:100%; max-width:520px; max-height:78vh; overflow-y:auto;
    border-radius:18px 18px 0 0; padding:16px 16px 26px;
    box-shadow:0 -10px 30px rgba(0,0,0,.25);
  }
  .modal-title{
    font-family:'Barlow Condensed'; font-weight:800; font-size:21px; color:var(--steel-dark);
    display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;
    position:sticky; top:0; background:#fff; padding-bottom:8px;
  }
  .modal-close{
    background:var(--panel-2); border:1px solid var(--border); width:30px;height:30px;
    border-radius:50%; cursor:pointer; font-size:14px; color:var(--muted);
  }
  .modal-zone-title{
    font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    color:var(--muted); margin:14px 2px 6px;
  }
  .modal-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:11px 13px; border:1px solid var(--border); border-radius:10px;
    margin-bottom:7px; cursor:pointer; background:var(--panel-2);
  }
  .modal-item:hover{border-color:var(--accent); background:#fff;}
  .modal-item .name{font-weight:600; font-size:14px; color:var(--ink);}
  .modal-item .star{color:#c99a1c; font-size:15px;}
  .already-tag{font-size:10px; font-weight:700; color:var(--muted-2); text-transform:uppercase; letter-spacing:.03em;}
  .modal-empty{color:var(--muted-2); font-size:13px; padding:10px 2px;}
  .io-desc{font-size:13px; color:var(--muted); line-height:1.5; margin:4px 2px 14px;}
  .io-divider{text-align:center; font-size:11px; color:var(--muted-2); margin:12px 0; text-transform:uppercase; letter-spacing:.05em;}
  .io-warn{font-size:11.5px; color:var(--muted-2); margin:10px 2px 0; text-align:center;}
  .delete-btn{
    background:transparent; border:1px solid var(--border); color:var(--danger);
    width:26px;height:26px;border-radius:7px; cursor:pointer; font-size:12.5px;
    display:flex;align-items:center;justify-content:center;
  }
  .delete-btn:hover{background:#fbeae7;}
</style>
</head>
<body>

      <div class="greeting" id="greeting">Gym Tracker</div>

<script>
/* ============ STORAGE (Claude artifact window.storage, con fallback a localStorage) ============ */
const useCloud = (typeof window.storage !== 'undefined');
async function storageGet(key){
  try{
    if(useCloud){
      const r = await window.storage.get(key, true);
      return r ? JSON.parse(r.value) : null;
    }else{
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : null;
    }
  }catch(e){ return null; }
}
async function storageSet(key, value){
  try{
    if(useCloud){
      await window.storage.set(key, JSON.stringify(value), true);
    }else{
      localStorage.setItem(key, JSON.stringify(value));
    }
  }catch(e){ console.error('storage error', e); }
}

function principalSlots(muscleNames){

  'Espalda': [E('Estiramiento de dorsal (gato-camello)'), E('Estiramiento de dorsal colgado en barra')],
  'Tríceps': [E('Estiramiento de tríceps por detrás de la cabeza'), E('Estiramiento de tríceps cruzado')],

const PROGRAM_VERSION = 4;
async function loadProgram(){
  const v = await storageGet('program-version');
  let p = await storageGet('program-structure');
  if(!p || v !== PROGRAM_VERSION){
    p = defaultProgram();
    await storageSet('program-structure', p);
    await storageSet('program-version', PROGRAM_VERSION);
  }
  state.program = p;
}
async function saveProgram(){
  await storageSet('program-structure', state.program);
}
async function loadData(){
  let logs = await storageGet('logs');
  let measures = await storageGet('measures');
  // Migración: si venía de la versión con perfiles Dioni/Carlos, fusiona lo que hubiera
  if(!logs){
    const oldD = (await storageGet('logs:Dioni')) || [];
    const oldC = (await storageGet('logs:Carlos')) || [];
    logs = [...oldD, ...oldC];
    if(logs.length) await storageSet('logs', logs);
  }
  if(!measures){
    const oldD = (await storageGet('measures:Dioni')) || [];
    const oldC = (await storageGet('measures:Carlos')) || [];
    measures = [...oldD, ...oldC];
    if(measures.length) await storageSet('measures', measures);
  }
  state.logs = logs || [];
  state.measures = measures || [];
  state.pendingSets = {};
}

          ${slots.map(s=>`<div class="zone-label">${s.muscle}</div>${renderSlot(day, s)}`).join('')}

function slotLoggedToday(slotId){
  const t = todayStr();
  return state.logs.find(l=>l.date===t && l.slotId===slotId);
}

function renderSlot(day, slot){
  const idx = state.slotIndex[slot.id] || 0;
  const curAlt = slot.alts[idx % slot.alts.length];
  const exName = curAlt.name;
  const isStar = !!curAlt.star;
  const loggedEntry = slotLoggedToday(slot.id);
  const isLoggedThisExercise = loggedEntry && loggedEntry.exercise === exName;

  const fields = FIELD_CONFIG[slot.cat];
  const isCardio = slot.cat === 'calentamiento';
  const showStar = slot.cat === 'principal';
  const hasFields = fields.length > 0;

  const dots = slot.alts.map((_,i)=>`<span class="${i===(idx%slot.alts.length)?'on':''}"></span>`).join('');

  function renderInput(f, value){
    if(f.type === 'select'){
      const opts = f.options.map(o=>`<option value="${o}" ${value===o?'selected':''}>${o}</option>`).join('');
      return `<select data-field="${f.key}"><option value="">${f.label}</option>${opts}</select>`;
    }
    return `<input type="number" inputmode="decimal" placeholder="${f.placeholder}" value="${value}" data-field="${f.key}">`;
  }

  let bodyHtml;
  if(hasFields){
    let sets = state.pendingSets[slot.id];
    if(!sets){
      sets = (loggedEntry && loggedEntry.exercise===exName) ? loggedEntry.sets.map(s=>({...s})) : [emptySet(slot.cat)];
      state.pendingSets[slot.id] = sets;
    }
    const setsHtml = sets.map((s,i)=>`
      <div class="set-row" data-slot="${slot.id}" data-setidx="${i}">
        <span class="idx">${i+1}</span>
        ${renderInput(fields[0], s[fields[0].key])}
        ${renderInput(fields[1], s[fields[1].key])}
        <button class="rm" data-rmset="${i}" title="Quitar">✕</button>
      </div>
    `).join('');
    bodyHtml = `
      <div class="sets-wrap">
        <div class="set-field-labels"><span></span><span>${fields[0].label}</span><span>${fields[1].label}</span><span></span></div>
        ${setsHtml}
        <div class="slot-footer">
          <button class="btn btn-add-set" data-addset="${slot.id}">${isCardio ? '+ tramo' : '+ serie'}</button>
          <button class="btn btn-save ${isLoggedThisExercise?'saved':''}" data-save="${slot.id}">${isLoggedThisExercise?'✓ Guardado':'Guardar'}</button>
        </div>
      </div>
    `;
  }else{
    // Estiramientos: sin campos, solo marcar como hecho
    bodyHtml = `
      <div class="sets-wrap">
        <div class="slot-footer">
          <button class="btn btn-save ${isLoggedThisExercise?'saved':''}" data-donetoggle="${slot.id}">${isLoggedThisExercise?'✓ Hecho hoy':'Marcar como hecho'}</button>
        </div>
      </div>
    `;
  }

  return `
    <div class="slot" data-slot-id="${slot.id}">
      ${isLoggedThisExercise ? '<div class="logged-badge">Registrado hoy</div>' : ''}
      <div class="slot-head">
        <div class="slot-nav">
          <button class="swipe-btn" data-swipe="${slot.id}:-1">‹</button>
          <div class="swipe-dots">${dots}</div>
          <button class="swipe-btn" data-swipe="${slot.id}:1">›</button>
        </div>
        <div class="slot-actions">
          ${showStar ? `<button class="icon-btn ${isStar?'star-active':''}" data-togglestar="${slot.id}" title="Marcar como ejercicio estrella para hipertrofia">★</button>` : ''}
          ${slot.cat!=='calentamiento' ? `<button class="delete-btn" data-deleteslot="${slot.id}" title="Eliminar este ejercicio de hoy">🗑</button>` : ''}
        </div>
      </div>
      <div class="exercise-name">${exName}${isStar ? ' <span class="star-mark">★</span>' : ''}</div>
      ${bodyHtml}
    </div>
  `;
}

function openAddExerciseModal(muscle){
  const day = state.program.days.find(d=>d.id===state.activeDayId);
  const present = new Set(day.slots.filter(s=>s.cat==='principal' && s.muscle===muscle).flatMap(s=>s.alts.map(a=>a.name)));
  const zones = MUSCLES[muscle] || [];
  let html = `<div class="modal-title">${muscle} <button class="modal-close" id="modalCloseBtn">✕</button></div>
    <p class="io-desc">Elige un ejercicio para añadir como tarjeta extra hoy — útil si vas con ganas de más.</p>`;

    alts.forEach(a=>{
      const already = present.has(a.name);
      html += `<div class="modal-item" data-pick-zone="${zone}" data-pick-name="${a.name}" data-pick-star="${a.star?1:0}">
        <span class="name">${a.name}${already ? ' <span class="already-tag">ya en tu día</span>' : ''}</span>${a.star?'<span class="star">★</span>':''}

  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  box.querySelectorAll('[data-pick-name]').forEach(el=>{

    });
  });
}

function exportExcel(){
  const wb = XLSX.utils.book_new();

  const logsRows = [];
  state.logs.forEach(l=>{
    const isCardio = l.cat === 'calentamiento';
    if(!l.sets || !l.sets.length){
      logsRows.push({Fecha:l.date, Categoria:l.cat, Musculo:l.muscle||'', Ejercicio:l.exercise, Serie:'Hecho', 'Reps o Minutos':'', 'Kg o Intensidad':''});
    }else{
      l.sets.forEach((s,i)=>{
        logsRows.push({
          Fecha:l.date, Categoria:l.cat, Musculo:l.muscle||'', Ejercicio:l.exercise, Serie:i+1,
          'Reps o Minutos': isCardio ? (s.minutos||'') : (s.reps||''),
          'Kg o Intensidad': isCardio ? (s.intensidad||'') : (s.weight||'')
        });
      });
    }
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(logsRows), 'Registros');

  const measRows = state.measures.map(m=>({
    Fecha:m.date, 'Peso (kg)':m.peso||'', 'Pecho (cm)':m.pecho||'', 'Cintura (cm)':m.cintura||'', 'Cadera (cm)':m.cadera||'',
    'Bíceps (cm)':m.biceps||'', 'Muslo (cm)':m.muslo||'', 'Gemelo (cm)':m.gemelo||''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(measRows), 'Medidas');

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{programaJSON: JSON.stringify(state.program)}]), 'Programa');

  XLSX.writeFile(wb, 'gym-tracker-backup-'+todayStr()+'.xlsx');
  closeModal();
}

async function importExcel(file){
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});

    const logsSheet = wb.Sheets['Registros'];
    if(logsSheet){
      const rows = XLSX.utils.sheet_to_json(logsSheet);
      const grouped = new Map();
      rows.forEach(r=>{
        const fecha = String(r.Fecha||'');
        const cat = r.Categoria||'';
        const muscle = r.Musculo||'';
        const exercise = r.Ejercicio||'';
        const key = fecha+'|'+cat+'|'+muscle+'|'+exercise;
        if(!grouped.has(key)) grouped.set(key, {date:fecha, cat, muscle: muscle||undefined, exercise, sets:[]});
        const isCardio = cat === 'calentamiento';
        const v1 = r['Reps o Minutos'], v2 = r['Kg o Intensidad'];
        if(r.Serie !== 'Hecho' && (v1!==undefined && v1!=='' || v2!==undefined && v2!=='')){
          grouped.get(key).sets.push(isCardio ? {minutos:v1||'', intensidad:v2||''} : {reps:v1||'', weight:v2||''});
        }
      });
      state.logs = [...grouped.values()].map((l,i)=>({...l, id:Date.now()+'-'+i}));
      await saveLogs();
    }

    const measSheet = wb.Sheets['Medidas'];
    if(measSheet){
      const rows = XLSX.utils.sheet_to_json(measSheet);
      state.measures = rows.map((r,i)=>({
        id: Date.now()+i, date: String(r.Fecha||''),
        peso:r['Peso (kg)']||'', pecho:r['Pecho (cm)']||'', cintura:r['Cintura (cm)']||'', cadera:r['Cadera (cm)']||'',
        biceps:r['Bíceps (cm)']||'', muslo:r['Muslo (cm)']||'', gemelo:r['Gemelo (cm)']||''
      }));
      await saveMeasures();
    }

    const progSheet = wb.Sheets['Programa'];
    if(progSheet){
      const rows = XLSX.utils.sheet_to_json(progSheet);
      if(rows[0] && rows[0].programaJSON){
        state.program = JSON.parse(rows[0].programaJSON);
        await saveProgram();
      }
    }

    closeModal();
    showToast('Datos importados ✓');
    render();
  }catch(err){
    console.error(err);
    showToast('No se pudo leer el archivo');
  }
}

      <div class="bl-item"><span class="bl-num">4</span>Cadera: ${val('cadera',' cm')}</div>
      <div class="bl-item"><span class="bl-num">5</span>Muslo: ${val('muslo',' cm')}</div>
      <div class="bl-item"><span class="bl-num">6</span>Gemelo: ${val('gemelo',' cm')}</div>
    </div>
  `;
}
function renderMedidas(){
  const fieldsHtml = MEASURE_FIELDS.map(f=>`
    <div class="field"><label>${f.label}</label><input type="number" inputmode="decimal" id="mf-${f.key}" placeholder="—"></div>
  `).join('');

  const sorted = [...state.measures].sort((a,b)=>a.date.localeCompare(b.date));
  const latest = sorted.length ? sorted[sorted.length-1] : {};
  const options = MEASURE_FIELDS.map(f=>`<option value="${f.key}">${f.label}</option>`).join('');

  const historyHtml = sorted.length ? [...sorted].reverse().map(m=>`
    <div class="history-row">
      <span class="hd">${fmtDate(m.date)}</span>
      <span class="hv">${MEASURE_FIELDS.filter(f=>m[f.key]!=='' && m[f.key]!=null).map(f=>`${f.label.split(' ')[0]}: ${m[f.key]}`).join(' · ') || '—'}</span>
      <button class="del" data-delmeasure="${m.id}">✕</button>
    </div>
  `).join('') : `<div class="empty-state"><p>Aún no hay medidas registradas.</p></div>`;

  return `
    <div class="chart-card body-figure-card">
      ${bodyFigureSVG()}
      ${bodyLegendHtml(latest)}
      ${!sorted.length ? '<div class="empty-state" style="padding-top:4px;"><p>Registra tus medidas para verlas aquí.</p></div>' : ''}
    </div>

    <div class="section-label">Registrar hoy</div>
    <div class="measure-form">
      <div class="measure-grid">${fieldsHtml}</div>
      <button class="btn btn-save" style="width:100%; margin-top:12px;" id="saveMeasureBtn">Guardar medidas de hoy</button>
    </div>

    <div class="chart-card">
      <div class="chart-head">
        <strong style="font-family:'Barlow Condensed'; font-size:16px;">Evolución</strong>
        <select id="measureMetric">${options}</select>
      </div>
      <canvas id="measuresCanvas" height="180"></canvas>
    </div>

    <div class="section-label">Historial</div>
    <div class="history-list">${historyHtml}</div>
  `;
}

function drawMeasuresChart(metric){
  const canvas = document.getElementById('measuresCanvas');
  if(!canvas) return;
  const sorted = [...state.measures]
    .filter(m=>m[metric]!=='' && m[metric]!=null)
    .sort((a,b)=>a.date.localeCompare(b.date));
  if(measuresChart){ measuresChart.destroy(); }
  measuresChart = new Chart(canvas, {
    type:'line',
    data:{
      labels: sorted.map(m=>fmtDate(m.date)),
      datasets:[{
        data: sorted.map(m=>m[metric]),
        borderColor:'#39647f',
        backgroundColor:'rgba(57,100,127,0.12)',
        borderWidth:2.5,
        pointRadius:3,
        pointBackgroundColor:'#39647f',
        tension:.3,
        fill:true
      }]
    },
    options:{
      plugins:{legend:{display:false}},
      scales:{
        y:{grid:{color:'#e8eaed'}, ticks:{font:{size:11}}},
        x:{grid:{display:false}, ticks:{font:{size:11}}}
      }
    }
  });
}

/* ============ TAB EVOLUCIÓN ============ */
function renderEvolucion(){
  const relevant = state.logs.filter(l=>l.cat!=='estiramiento');
  const groupOf = l => l.cat==='calentamiento' ? 'Calentamiento' : (l.muscle || 'Otros');
  const keyOf = l => groupOf(l)+'|'+l.exercise;

  const keys = [...new Set(relevant.map(keyOf))];
  if(!keys.length){
    return `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M3 17l6-6 4 4 8-8"/></svg>
      <p>Cuando registres series en la pestaña Ejercicios,<br>aquí verás tu progreso por ejercicio.</p>
    </div>`;
  }

  const groups = {};
  keys.forEach(k=>{
    const group = k.split('|')[0];
    (groups[group] = groups[group] || []).push(k);
  });
  const groupNames = Object.keys(groups).sort((a,b)=> a==='Calentamiento' ? -1 : b==='Calentamiento' ? 1 : a.localeCompare(b,'es'));

  return groupNames.map(group=>{
    const itemsHtml = groups[group].sort().map(key=>{
      const name = key.split('|')[1];
      const entries = relevant.filter(l=>keyOf(l)===key);
      const isCardio = entries[0].cat === 'calentamiento';
      let maxV = 0, lastDate = '';
      entries.forEach(e=>{
        e.sets.forEach(s=>{ const v = parseFloat(isCardio ? s.minutos : s.weight); if(!isNaN(v) && v>maxV) maxV = v; });
        if(e.date > lastDate) lastDate = e.date;
      });
      const isOpen = state.openEvo === key;
      return `
        <div class="evo-item" data-evo="${key}">
          <div class="evo-top">
            <div>
              <div class="evo-name">${name}</div>
              <div class="evo-meta">Última vez: ${fmtDate(lastDate)} · ${entries.length} sesión(es)</div>
            </div>
            <div class="evo-max">${maxV || '–'}<span> ${isCardio ? 'min máx' : 'kg máx'}</span></div>
          </div>
          <div class="evo-chart-wrap ${isOpen?'open':''}" id="evoChartWrap-${cssId(key)}">
            <canvas id="evoCanvas-${cssId(key)}" height="140"></canvas>
          </div>
        </div>
      `;
    }).join('');
    return `<div class="muscle-group"><div class="muscle-title">${group}</div>${itemsHtml}</div>`;
  }).join('');
}
function cssId(s){ return s.replace(/[^a-zA-Z0-9]/g,'_'); }

let evoCharts = {};
function drawEvoChart(key){
  const canvas = document.getElementById('evoCanvas-'+cssId(key));
  if(!canvas) return;
  const [group, name] = key.split('|');
  const entries = state.logs.filter(l=>(l.cat==='calentamiento'?'Calentamiento':(l.muscle||'Otros'))===group && l.exercise===name).sort((a,b)=>a.date.localeCompare(b.date));
  const isCardio = entries.length && entries[0].cat === 'calentamiento';
  const data = entries.map(e=>{
    let max=0; e.sets.forEach(s=>{const v=parseFloat(isCardio ? s.minutos : s.weight); if(!isNaN(v)&&v>max)max=v;});
    return max;
  });
  if(evoCharts[key]) evoCharts[key].destroy();
  evoCharts[key] = new Chart(canvas, {
    type:'line',
    data:{
      labels: entries.map(e=>fmtDate(e.date)),
      datasets:[{
        data,
        borderColor:'#4a5a68',
        backgroundColor:'rgba(74,90,104,0.12)',
        borderWidth:2.5,
        pointRadius:3,
        pointBackgroundColor:'#4a5a68',
        tension:.3,
        fill:true
      }]
    },
    options:{
      plugins:{legend:{display:false}},
      scales:{
        y:{grid:{color:'#e8eaed'}, ticks:{font:{size:11}}},
        x:{grid:{display:false}, ticks:{font:{size:11}}}
      }
    }
  });
}

/* ============ HANDLERS ============ */
function attachTabHandlers(){
  if(state.tab==='ejercicios'){
    document.querySelectorAll('.day-chip').forEach(el=>{
      el.addEventListener('click', ()=>{ state.activeDayId = el.dataset.day; render(); });
    });
    document.querySelectorAll('[data-swipe]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const [slotId, dir] = el.dataset.swipe.split(':');
        const day = state.program.days.find(d=>d.id===state.activeDayId);
        const slot = day.slots.find(s=>s.id===slotId);
        const cur = state.slotIndex[slotId] || 0;
        let next = (cur + parseInt(dir)) % slot.alts.length;
        if(next<0) next += slot.alts.length;
        state.slotIndex[slotId] = next;
        delete state.pendingSets[slotId];
        render();
      });
    });
    document.querySelectorAll('[data-addset]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.dataset.addset;
        const day = state.program.days.find(d=>d.id===state.activeDayId);
        const slot = day.slots.find(s=>s.id===id);
        state.pendingSets[id] = state.pendingSets[id] || [];
        state.pendingSets[id].push(emptySet(slot.cat));
        render();
      });
    });
    document.querySelectorAll('.set-row input, .set-row select').forEach(el=>{
      el.addEventListener('input', ()=>{
        const row = el.closest('.set-row');
        const slotId = row.dataset.slot;
        const idx = parseInt(row.dataset.setidx);
        const field = el.dataset.field;
        state.pendingSets[slotId][idx][field] = el.value;
      });
    });
    document.querySelectorAll('.rm[data-rmset]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const row = el.closest('.set-row');
        const slotId = row.dataset.slot;
        const idx = parseInt(el.dataset.rmset);
        const day = state.program.days.find(d=>d.id===state.activeDayId);
        const slot = day.slots.find(s=>s.id===slotId);
        state.pendingSets[slotId].splice(idx,1);
        if(!state.pendingSets[slotId].length) state.pendingSets[slotId].push(emptySet(slot.cat));
        render();
      });
    });
    document.querySelectorAll('[data-save]').forEach(el=>{
      el.addEventListener('click', async ()=>{
        const slotId = el.dataset.save;
        const day = state.program.days.find(d=>d.id===state.activeDayId);
        const slot = day.slots.find(s=>s.id===slotId);
        const idx = state.slotIndex[slotId] || 0;
        const exName = slot.alts[idx % slot.alts.length].name;
        const sets = (state.pendingSets[slotId]||[]).filter(s=>Object.values(s).some(v=>v!==''));
        if(!sets.length){ showToast('Añade al menos un dato'); return; }
        const t = todayStr();
        state.logs = state.logs.filter(l=>!(l.date===t && l.slotId===slotId));
        state.logs.push({
          id: Date.now()+'-'+slotId,
          date: t, dayId: day.id, slotId, cat: slot.cat, muscle: slot.muscle,
          exercise: exName, sets: sets.map(s=>({...s}))
        });
        await saveLogs();
        showToast('Guardado ✓');
        render();
      });
    });
    document.querySelectorAll('[data-donetoggle]').forEach(el=>{
      el.addEventListener('click', async ()=>{
        const slotId = el.dataset.donetoggle;
        const day = state.program.days.find(d=>d.id===state.activeDayId);
        const slot = day.slots.find(s=>s.id===slotId);
        const idx = state.slotIndex[slotId] || 0;
        const exName = slot.alts[idx % slot.alts.length].name;
        const t = todayStr();
        const already = state.logs.find(l=>l.date===t && l.slotId===slotId && l.exercise===exName);
        if(already){
          state.logs = state.logs.filter(l=>l.id!==already.id);
        }else{
          state.logs = state.logs.filter(l=>!(l.date===t && l.slotId===slotId));
          state.logs.push({id:Date.now()+'-'+slotId, date:t, dayId:day.id, slotId, cat:slot.cat, muscle:slot.muscle, exercise:exName, sets:[]});
        }
        await saveLogs();
        render();
      });
    });
    document.querySelectorAll('[data-togglestar]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const slotId = el.dataset.togglestar;
        const day = state.program.days.find(d=>d.id===state.activeDayId);
        const slot = day.slots.find(s=>s.id===slotId);
        const idx = state.slotIndex[slotId] || 0;
        const cur = slot.alts[idx % slot.alts.length];
        cur.star = !cur.star;
        saveProgram(); render();
      });
    });
    document.querySelectorAll('[data-add-zone]').forEach(el=>{
      el.addEventListener('click', ()=>{
        openAddExerciseModal(el.dataset.addZone);
      });
    });
    document.querySelectorAll('[data-deleteslot]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const slotId = el.dataset.deleteslot;
        if(!confirm('¿Quitar este ejercicio de hoy?')) return;
        const day = state.program.days.find(d=>d.id===state.activeDayId);
        day.slots = day.slots.filter(s=>s.id!==slotId);
        delete state.slotIndex[slotId];
        delete state.pendingSets[slotId];
        saveProgram(); render();
      });
    });
  }

  if(state.tab==='medidas'){
    document.getElementById('saveMeasureBtn').addEventListener('click', async ()=>{
      const entry = {id:Date.now(), date: todayStr()};
      let any = false;
      MEASURE_FIELDS.forEach(f=>{
        const v = document.getElementById('mf-'+f.key).value;
        entry[f.key] = v;
        if(v!=='') any = true;
      });
      if(!any){ showToast('Introduce al menos un dato'); return; }
      state.measures = state.measures.filter(m=>m.date!==entry.date);
      state.measures.push(entry);
      await saveMeasures();
      showToast('Medidas guardadas ✓');
      render();
    });
    document.querySelectorAll('[data-delmeasure]').forEach(el=>{
      el.addEventListener('click', async ()=>{
        const id = parseInt(el.dataset.delmeasure);
        state.measures = state.measures.filter(m=>m.id!==id);
        await saveMeasures();
        render();
      });
    });
    const metricSel = document.getElementById('measureMetric');
    metricSel.addEventListener('change', ()=>drawMeasuresChart(metricSel.value));
    drawMeasuresChart(metricSel.value);
  }

  if(state.tab==='evolucion'){
    document.getElementById('ioBtnEvo').addEventListener('click', openIoModal);
    document.querySelectorAll('[data-evo]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const name = el.dataset.evo;
        state.openEvo = (state.openEvo===name) ? null : name;
        render();
        if(state.openEvo) setTimeout(()=>drawEvoChart(state.openEvo), 0);
      });
    });
    if(state.openEvo) setTimeout(()=>drawEvoChart(state.openEvo), 0);
  }
}

document.querySelector('.tabbar').addEventListener('click', (e)=>{
  const btn = e.target.closest('.tab-btn');
  if(!btn) return;
  state.tab = btn.dataset.tab;
  state.openEvo = null;
  render();
});

/* ============ INIT ============ */
(async function init(){
  await loadProgram();
  await loadData();
  render();
})();
</script>
