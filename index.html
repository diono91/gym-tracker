<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Gym Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Registra tus entrenos, mide tu evolución y mantén la racha.">
<meta name="theme-color" content="#0b0c0d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8v8M2 10v4M20 8v8M22 10v4M7 6v12M17 6v12M7 12h10"/></svg>
      </div>
      <div class="brand-text">
        <span class="word1">Gym Tracker</span>
        <span class="word2">Registra · Progresa</span>
      </div>
      <div class="topbar-streak" id="topbarStreak"></div>
    </div>
    <div class="hero-scene" id="heroScene"></div>
  </div>
  <main id="main"></main>
  <div class="tabbar">
    <button class="tab-btn" data-tab="hoy"><span class="dot"></span>
      <svg viewBox="0 0 24 24"><path d="M6.5 7.5l11 11M4 9l4-4 3 3-4 4-3-3zM13 18l4-4 3 3-4 4-3-3z"/></svg>
      Hoy
    </button>
    <button class="tab-btn" data-tab="medidas"><span class="dot"></span>
      <svg viewBox="0 0 24 24"><path d="M3 12h18M3 12v3M7 12v5M11 12v3M15 12v5M19 12v3"/></svg>
      Medidas
    </button>
    <button class="tab-btn" data-tab="progreso"><span class="dot"></span>
      <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M21 7v6M15 13v6"/></svg>
      Progreso
    </button>
    <button class="tab-btn" data-tab="calendario"><span class="dot"></span>
      <svg viewBox="0 0 24 24"><path d="M3 8h18M7 3v4M17 3v4M4 5h16a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>
      Calendario
    </button>
    <button class="tab-btn" data-tab="batalla"><span class="dot"></span>
      <svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/><path d="M8 8l-2 2M16 8l2 2M8 16l-2-2M16 16l2-2"/></svg>
      Batalla
    </button>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
</body>
</html>
